<style>
  /* 3D floating background */
  body {
    perspective: 1200px;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    width: 180px;
    height: 180px;
    border-radius: 35px;
    pointer-events: none;
    z-index: -1;
    opacity: 0.12;
    filter: blur(1px);
  }

  body::before {
    top: 15%;
    left: -70px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    transform: rotateX(55deg) rotateY(25deg) rotateZ(25deg);
    animation: floating3D 8s ease-in-out infinite;
  }

  body::after {
    right: -70px;
    bottom: 12%;
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    transform: rotateX(55deg) rotateY(-25deg) rotateZ(-25deg);
    animation: floating3DReverse 10s ease-in-out infinite;
  }

  @keyframes floating3D {
    0%,
    100% {
      transform: translateY(0) rotateX(55deg) rotateY(25deg) rotateZ(25deg);
    }

    50% {
      transform: translateY(-35px) rotateX(65deg) rotateY(40deg) rotateZ(35deg);
    }
  }

  @keyframes floating3DReverse {
    0%,
    100% {
      transform: translateY(0) rotateX(55deg) rotateY(-25deg) rotateZ(-25deg);
    }

    50% {
      transform: translateY(35px) rotateX(65deg) rotateY(-40deg) rotateZ(-35deg);
    }
  }

  /* 3D Hero effect */
  .hero {
    transform-style: preserve-3d;
    transition:
      transform 0.5s ease,
      box-shadow 0.5s ease;
  }

  .hero:hover {
    transform: translateY(-5px) rotateX(1deg) rotateY(-1deg);
    box-shadow:
      0 25px 60px rgba(37, 99, 235, 0.3),
      0 10px 30px rgba(0, 0, 0, 0.1);
  }

  /* 3D summary cards */
  .summary-card {
    transform-style: preserve-3d;

  .operator-card {

  }

    transform: translateZ(25px);

  .main-card {

      box-shadow 0.4s ease;
  }

  .main-card:hover {
    transform: translateY(-4px);

  .save-btn {
    transform-style: preserve-3d;
    box-shadow: 0 7px 0 #1d4ed8;
  }

  .save-btn:hover {
    transform: translateY(-3px);

  .table-container {

  /* Company image 3D */
  .report-image {

  }

  /* Smooth page appearance */
  body {
    animation: pageAppear 0.8s ease-out;
  }

      opacity: 0;

    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Mobile friendly */
  @media (max-width: 768px) {

    .operator-card:hover,
    .main-card:hover,

      transform: translateY(-3px);
    }
  }

  /* Respect user's reduced-motion setting */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
